<!doctype html>
<!--
  ============================================================================
  Neon City: Vice Circuit — shell page
  ============================================================================
  Structure:
    canvas#game  : full-viewport render surface (crosshair cursor, no touch
                   scroll). The entire game — world and HUD — draws into it.
    p#status     : visually hidden, screen-reader-only status line. main.js
                   writes progress/mission text here via aria-live announcements.
    script       : the ES-module entry point, game/src/main.js (no bundler;
                   the browser resolves the module graph from src/ directly).
  There are no other DOM elements: every visible UI element is canvas-drawn.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon City: Vice Circuit</title>
  <style>
    /* Kill the page chrome: the canvas is the whole app. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0c14; }
    /* Fixed full-viewport canvas; crosshair doubles as the aiming reticle. */
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
    /* Read aloud, never shown: the status line screen readers announce. */
    #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Neon City Vice Circuit: a top-down neon-noir crime sandbox. WASD to walk and drive, F to enter or leave a car, click to shoot, Space for the handbrake, M for the map, Esc to pause."></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
