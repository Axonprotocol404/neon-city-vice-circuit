<!doctype html>
<!--
  Neon City: Vice Circuit — shell page.
  canvas#game      : full-viewport render surface (crosshair cursor, no touch scroll)
  p#status         : visually hidden, screen-reader-only status line
  script           : the ES-module entry point, game/src/main.js
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon City: Vice Circuit</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0c14; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
    /* Read aloud, never shown: the status line screen readers announce. */
    #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Neon City Vice Circuit: a top-down neon-noir crime sandbox. WASD to walk and drive, F to enter or leave a car, click to shoot, Space for the handbrake, M for the map, Esc to pause."></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
